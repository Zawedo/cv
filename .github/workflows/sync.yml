name: Synchro des matchs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Appel du endpoint de synchro
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets APP_URL / CRON_SECRET non configurés, rien à faire."; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/sync"
