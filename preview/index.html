<style>
:root{--red:#E30613;--red-d:#B0040E;--black:#0B0B0B;--ink:#141414;--card:#1C1C1C;--line:#2C2C2C;--muted:#9A9A9A;--gold:#F5C400;--green:#22a559}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:#fff;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}
.d{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:-.01em}
.muted{color:var(--muted)}
.tag{display:inline-block;transform:skewX(-12deg);padding:2px 8px;font-family:"Barlow Condensed";font-weight:800;font-style:italic;text-transform:uppercase;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;font-family:"Barlow Condensed";font-weight:800;font-style:italic;text-transform:uppercase;font-size:17px;transition:.15s}
.btn-red{background:var(--red)}.btn-red:hover{background:var(--red-d)}
.btn-ghost{border:1px solid var(--line)}.btn-ghost:hover{border-color:#fff}
.input{width:100%;background:var(--ink);border:1px solid var(--line);padding:12px 16px;color:#fff;font:inherit}
.input:focus{outline:none;border-color:var(--red)}
.card{background:var(--card);border:1px solid var(--line)}
.wrap{max-width:1152px;margin:0 auto;padding:0 16px}
.preview-bar{background:var(--gold);color:#000;font-size:13px;font-weight:600;text-align:center;padding:6px 16px}
.preview-bar button{text-decoration:underline;font-weight:700}
/* logo */
.logo{display:inline-flex;align-items:center;gap:8px;font-size:22px;white-space:nowrap;flex-shrink:0}
.logo .w{background:var(--red);transform:skewX(-12deg);padding:1px 8px}.logo .w span{display:inline-block;transform:skewX(12deg)}
.logo.big{font-size:40px}.logo.onred .w{background:var(--black)}
/* header */
header{position:sticky;top:0;z-index:10;background:rgba(11,11,11,.95);backdrop-filter:blur(6px);border-bottom:2px solid var(--red)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding-top:12px;padding-bottom:12px}
header nav{display:flex;gap:4px;overflow-x:auto}
header nav button{padding:6px 12px;font-size:19px;color:var(--muted)}header nav button:hover{color:#fff}header nav button.on{background:var(--red);color:#fff}
.who{margin-left:auto;display:flex;gap:12px;font-size:14px;align-items:center}

main.wrap{padding-top:32px;padding-bottom:48px}
.ptitle{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}
.ptitle h1{font-size:clamp(36px,6vw,52px);line-height:1;margin-top:8px}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{padding:6px 16px;font-size:19px;background:var(--card);color:var(--muted)}.tabs button:hover{color:#fff}.tabs button.on{background:#fff;color:#000}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
.rules{font-size:14px;margin-bottom:24px}.rules b{color:#fff}
.day{margin-bottom:32px}.day h2{font-size:26px;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:12px}
.grid{display:grid;gap:12px}@media(min-width:768px){.grid{grid-template-columns:1fr 1fr}}
/* match card */
.m{position:relative}.m.picked{border-left:4px solid var(--red)}
.m-head{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.m-head .t{font-weight:700;color:#fff;margin-left:auto}
.m-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:16px}
.team{display:flex;align-items:center;gap:12px;min-width:0}.team.r{flex-direction:row-reverse;text-align:right}.team.lost{opacity:.45}
.badge{width:44px;height:44px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-family:"Barlow Condensed";font-weight:800;font-style:italic;font-size:14px}
.tname{font-size:clamp(18px,2.4vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub{font-size:12px;font-weight:600}
.score{font-size:30px;text-align:center}
.opts{display:grid;gap:6px;padding:0 16px}
.opts button{background:var(--ink);color:var(--muted);padding:8px 0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(hover:hover){.opts button:not(:disabled):not(.sel):hover{background:var(--line);color:#fff}}
.opts button.sel{background:var(--red);color:#fff}
.opts button:disabled{cursor:default}.opts button:disabled:not(.sel){opacity:.4}
.m-foot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding:12px 16px 16px;font-size:12px;color:var(--muted)}
.comm{margin-left:auto;display:flex;align-items:center;gap:8px}
.bar{display:flex;width:96px;height:6px;background:var(--line)}.bar i{background:var(--red)}
.live{animation:p 1.4s infinite}@keyframes p{50%{opacity:.4}}
/* leaderboard */
.podium{display:grid;gap:12px;margin-bottom:32px}@media(min-width:640px){.podium{grid-template-columns:repeat(3,1fr)}}
.pod{position:relative;overflow:hidden;padding:20px}.pod.first{border-color:var(--gold)}
.pod .n{position:absolute;right:8px;top:-20px;font-size:110px;color:rgba(255,255,255,.05)}
.pod .nm{font-size:30px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--ink);color:var(--muted);text-align:left;padding:12px 16px;font-size:16px}
td{border-top:1px solid var(--line);padding:12px 16px}.num{text-align:right}tr.me{background:rgba(227,6,19,.15)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:32px}@media(min-width:640px){.stats{grid-template-columns:repeat(6,1fr)}}
.stat{padding:16px;min-width:0}.stat small{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat div{font-size:30px}
.hist>div{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;font-size:14px;border-top:1px solid var(--line)}.hist>div:first-child{border-top:0}
/* login */
.login{display:grid;min-height:calc(100vh - 31px)}@media(min-width:1024px){.login{grid-template-columns:1fr 1fr}}
.hero{position:relative;overflow:hidden;background:var(--red);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:48px}
.hero:after{content:"";position:absolute;right:-96px;top:0;height:100%;width:288px;transform:skewX(-12deg);background:rgba(176,4,14,.6)}
.hero>*{position:relative;z-index:1}.hero h1{font-size:clamp(48px,7vw,80px);line-height:.95}
.hero p{margin-top:24px;max-width:440px;font-size:18px;color:rgba(255,255,255,.9)}
.side{display:flex;align-items:center;justify-content:center;padding:32px}.side>div{width:100%;max-width:380px}
.err{color:var(--red);font-size:14px;margin-top:8px}
footer{border-top:1px solid var(--line);padding:24px 16px;text-align:center;font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;font-weight:600;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30;white-space:nowrap}.toast.on{opacity:1}
.short{display:none}
.who b{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout svg{display:none}
.bnav{display:none}
.seg{display:flex;gap:4px}
/* historique : une ligne sur ordinateur */
.h{display:grid;grid-template-columns:52px 210px 1fr auto 120px;grid-template-areas:"tag date teams prono pts";align-items:center;gap:6px 12px;padding:12px 16px;font-size:14px;border-top:1px solid var(--line)}
.h:first-child{border-top:0}.h .a{grid-area:tag}.h .b{grid-area:date}.h .c{grid-area:teams;font-weight:600}.h .e{grid-area:prono}.h .f{grid-area:pts;text-align:right}
/* tablette */
@media(max-width:1100px){.m-body{align-items:start}.team,.team.r{flex-direction:column;text-align:center;gap:6px}.tname{white-space:normal;line-height:1.05;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.score{padding-top:6px}}
@media(max-width:900px){.h{grid-template-columns:auto 1fr auto;grid-template-areas:"tag date pts" "teams teams teams" "prono prono prono"}}
/* ================= TÉLÉPHONE ================= */
@media(max-width:640px){
  .long{display:none}.short{display:inline}
  header .wrap{flex-wrap:nowrap;padding-top:10px;padding-bottom:10px}
  header nav{display:none}
  .logo{font-size:19px}.logo.big{font-size:30px}
  .who{gap:8px;min-width:0}.who b{max-width:110px;font-size:13px}
  .logout span{display:none}.logout svg{display:block}.logout{padding:6px;margin-right:-6px}
  .bnav{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(11,11,11,.97);backdrop-filter:blur(8px);border-top:2px solid var(--red);padding-bottom:env(safe-area-inset-bottom)}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:15px;color:var(--muted);position:relative}
  .bnav button.on{color:#fff}.bnav button.on:before{content:"";position:absolute;top:-2px;left:25%;right:25%;height:3px;background:#fff}
  .bnav svg{width:22px;height:22px}
  body.app{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  body.app .toast{bottom:calc(78px + env(safe-area-inset-bottom))}
  main.wrap{padding-top:20px}
  .ptitle{margin-bottom:16px}.ptitle>*{width:100%}
  .seg button{flex:1}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:1 0 auto;padding:6px 14px;font-size:17px}
  .row{gap:10px;margin-bottom:16px}.row .tabs{width:calc(100% + 32px)}
  .rules{font-size:13px;margin-bottom:16px}
  .day{margin-bottom:24px}.day h2{font-size:22px;position:sticky;top:57px;z-index:5;background:var(--black);padding-top:6px}
  .m-head{padding:8px 12px}
  .m-body{padding:14px 12px;gap:8px;align-items:start}
  .badge{width:40px;height:40px}
  .score{font-size:26px;padding-top:6px}
  .opts{padding:0 12px}.opts button{padding:11px 0;font-size:17px}
  .m-foot{padding:10px 12px 14px}
  .comm{margin-left:0;width:100%;justify-content:space-between}.bar{flex:1}
  .podium{grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
  .pod{padding:12px 10px}.pod .n{font-size:64px;top:-8px;right:4px}.pod .nm{font-size:17px;margin-top:6px}.pod .muted{font-size:12px}.pod .muted span{display:none}
  th,td{padding:10px 8px}th{font-size:14px}.hide-sm{display:none}
  .stats{grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:24px}.stat{grid-column:span 2;padding:12px}.stat div{font-size:24px}.stat small{font-size:10px}
  .hero{padding:28px 20px;gap:28px}.side{padding:28px 20px}
  .mypos{display:flex!important;justify-content:space-between;align-items:center;text-align:left!important;padding:10px 14px!important}.mypos .d{font-size:24px!important}
  footer{display:none}
}
/* classement par période */
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:12px}
.pnav{display:flex;align-items:center;gap:8px;margin-left:auto}.pnav .pl{min-width:170px;text-align:center}
.pnav .pl b{display:block;font-size:24px;line-height:1}.pnav .pl small{font-size:12px;color:var(--muted)}
.pnav .btn{padding:10px 14px}.pnav .btn[disabled]{visibility:hidden}
.pod,.pn button{cursor:pointer}.pn button:hover{text-decoration:underline}.pod:hover{border-color:#fff}
/* pronos des autres */
.oth{border-top:1px solid var(--line);margin:0 16px;padding:8px 0 14px}
.oth>button{font-size:12px;font-weight:600;color:var(--muted)}.oth>button:hover{color:#fff}
.oth ul{list-style:none;display:grid;gap:4px 16px;margin-top:8px;font-size:12px}
.oth li{display:flex;align-items:center;gap:8px;min-width:0}
.oth li button{flex:1;min-width:0;text-align:left;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.oth li button:hover{text-decoration:underline}
.oth li span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.oth li b{width:56px;text-align:right;flex-shrink:0}
@media(min-width:640px){.oth ul{grid-template-columns:1fr 1fr}}
/* badges */
.bhead{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}.bhead h2{font-size:26px}
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:32px}
@media(min-width:640px){.bgrid{grid-template-columns:repeat(3,1fr)}}@media(min-width:1000px){.bgrid{grid-template-columns:repeat(5,1fr)}}
.bdg{display:flex;gap:10px;align-items:flex-start;padding:10px;min-width:0}.bdg.off{opacity:.45}
.bdg .ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:rgba(0,0,0,.25)}.bdg.off .ic{filter:grayscale(1)}
.bdg>div{min-width:0}.bdg .bn{font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bdg .bd{font-size:11px;color:var(--muted);line-height:1.3;margin-top:2px}
.bpr{display:flex;align-items:center;gap:6px;margin-top:6px}.bpr span{flex:1;height:4px;background:var(--line)}.bpr i{display:block;height:100%;background:var(--red)}.bpr small{font-size:10px;color:var(--muted)}
.more{display:flex;justify-content:center;margin:8px 0 24px}
@media(max-width:640px){.prow .seg{width:100%}.pnav{width:100%;justify-content:space-between;margin-left:0}.oth{margin:0 12px}}
/* bonus outsider */
.hint{padding:0 16px 14px;margin-top:-6px;font-size:12px;font-weight:600;color:var(--gold)}
/* rappels Slack */
.slackbox{padding:16px;margin-bottom:32px;display:grid;gap:14px}
.slackbox .top{display:flex;align-items:center;gap:16px}.slackbox .top>div{flex:1;min-width:0}
.slackbox .top p{font-size:14px;color:var(--muted);margin-top:2px}
.sw{position:relative;width:56px;height:32px;background:var(--line);flex-shrink:0}.sw.on{background:var(--red)}
.sw i{position:absolute;top:4px;left:4px;width:24px;height:24px;background:#fff;transition:left .15s}.sw.on i{left:28px}
.slackmsg{display:flex;gap:10px;background:#1a1d21;border:1px solid #34373c;border-radius:6px;padding:12px 14px;font-size:14px;color:#d1d2d3;line-height:1.45}
.slackmsg .av{width:36px;height:36px;border-radius:4px;background:var(--red);display:flex;align-items:center;justify-content:center;font:900 italic 18px Arial;color:#fff;flex-shrink:0}
.slackmsg b{color:#fff}.slackmsg .app{font-size:10px;background:#34373c;color:#ababad;padding:1px 4px;border-radius:2px;margin-left:4px;vertical-align:1px}
.slackmsg .when{font-size:12px;color:#ababad;margin-left:6px}.slackmsg .lines{margin:4px 0 8px}
.slackmsg .sbtn{display:inline-block;border:1px solid #e01e5a;color:#fff;background:#e01e5a;border-radius:4px;padding:3px 12px;font-weight:700;font-size:13px}
.slackbox small{font-size:12px;color:var(--muted)}
/* logos */
.badge.lgimg{background:none;object-fit:contain}
.node button.sel .badge.lgimg,.node button.win .badge.lgimg{background:rgba(0,0,0,.45);padding:2px}
/* tableaux */
.tcards{display:grid;gap:12px}@media(min-width:768px){.tcards{grid-template-columns:1fr 1fr}}
.tcard{display:block;width:100%;text-align:left;padding:20px;transition:border-color .15s}.tcard:hover{border-color:#fff}
.tcard .th{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.tcard .th .tag:last-child{margin-left:auto}
.tcard h2{font-size:38px;margin-top:10px;line-height:1}.tcard p{font-size:14px;color:var(--muted);margin-top:4px}
.tcard .tf{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;border-top:1px solid var(--line);margin-top:16px;padding-top:14px;font-size:14px}
.tcard .tf>span:last-child{margin-left:auto}.champ{display:flex;align-items:center;gap:8px}
.back{display:inline-block;margin-bottom:12px;font-size:14px;color:var(--muted)}.back:hover{color:#fff}
.bnote{font-size:14px;color:var(--muted);margin-bottom:24px;max-width:720px}
.bprog{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:24px}
.bprog .pb{flex:1;min-width:96px;max-width:320px;height:6px;background:var(--line)}.bprog .pb i{display:block;height:100%;background:var(--red);transition:width .2s}
.bprog .hint{font-size:12px;color:var(--muted)}.bprog .tag:last-child{margin-left:auto}
.cstats{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:14px 16px;margin-bottom:24px;font-size:14px}
.bsec{margin-bottom:32px}.bsec>h2{font-size:24px;margin-bottom:12px}
.bcols{display:flex;gap:16px}.bcol{flex:1;min-width:0;display:flex;flex-direction:column}
.bcol>small{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.bnodes{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.node.final{border-color:var(--gold)}
.node .nh{display:flex;justify-content:space-between;padding:6px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
.node button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 12px;text-align:left}
.node button+button{border-top:1px solid var(--line)}
@media(hover:hover){.node button:not(:disabled):not(.sel):hover{background:var(--line)}}
.node button.sel{background:var(--red)}.node button.win{background:#1d6b3a}.node button.wrong{background:rgba(227,6,19,.25)}
.node button.wrong .tn{text-decoration:line-through;opacity:.7}.node button:disabled{cursor:default}
.node .tn{font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node .tn.tbd{color:var(--muted)}
.node .ok{font-size:12px;font-weight:700;color:#4ade80}
.node .nf{border-top:1px solid var(--line);padding:6px 12px;font-size:12px;color:var(--muted)}.node .nf s{color:#fff}
.ph{width:28px;height:28px;border:1px dashed var(--line);flex-shrink:0}
@media(max-width:1000px){.bcols{flex-direction:column;gap:20px}.bnodes{display:grid;grid-template-columns:1fr 1fr}}
@media(max-width:640px){.bnodes{grid-template-columns:1fr}.tcard h2{font-size:32px}
  .bprog{position:sticky;top:57px;z-index:5;background:var(--black);margin:0 -16px 20px;padding:10px 16px;border-bottom:1px solid var(--line)}
  .bnav{grid-template-columns:repeat(4,1fr)!important}.bnav button{font-size:14px!important}}
@media(max-width:360px){.logo{font-size:17px}.who b{max-width:90px}.hide-xs{display:none}th,td{padding:10px 6px}.pn{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tname{font-size:16px}}
</style>
</head>
<body>
<div class="preview-bar"><span class="long">Version preview · données fictives · tes pronos sont enregistrés uniquement dans ce navigateur</span><span class="short">Preview · données fictives</span> · <button onclick="resetDemo()">réinitialiser</button></div>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const LEAGUES=[{code:"LCK",name:"LCK",color:"#C8102E"},{code:"LPL",name:"LPL",color:"#E8B100"},{code:"LEC",name:"LEC",color:"#00C2C7"},{code:"LCS",name:"LCS",color:"#0A96FF"},{code:"MSI",name:"MSI",color:"#7C5CFF",intl:1},{code:"WORLDS",name:"Worlds",color:"#C89B3C",intl:1}];

    f("Coup de maître","Score exact en BO5 avec le bonus ×2","👑","or",ouv.some(x=>x.ex&&x.bo>=5&&x.mult>=2)),c("Globe-trotter","Un bon prono en LCK, LPL, LEC et LCS","🌍","argent",lw.size,4),
    f("Architecte","Remplir un tableau en entier","📐","bronze",bs.some(b=>b.complete)),f("Visionnaire","Trouver le champion d'un tableau","🔮","argent",bs.some(b=>b.champ)),f("Oracle","Un tableau parfait","🏛️","or",bs.some(b=>b.perfect)),
    f("Champion du mois","Finir 1er d'un classement mensuel","🏆","or",mw.length>0,mw.join(", ")),f("Podium de split","Finir dans le top 3 d'un split","🥉","argent",sp.length>0,sp.join(", "))]}
const TIER={bronze:"#C08457",argent:"#C9CED6",or:"#F5C400"};
function badgeGrid(list){const n=list.filter(b=>b.earned).length;
  return`<div class="bhead"><h2 class="d">Badges</h2><span class="muted" style="font-size:14px">${n}/${list.length}</span></div><div class="bgrid">`+list.map(b=>`<div class="card bdg ${b.earned?"":"off"}" title="${esc(b.desc)}" ${b.earned?`style="border-color:${TIER[b.tier]}"`:""}><span class="ic" aria-hidden="true">${b.icon}</span><div><div class="d bn">${esc(b.name)}</div><div class="bd">${esc(b.detail||b.desc)}</div>${!b.earned&&b.prog&&b.prog[1]>1?`<div class="bpr"><span><i style="width:${b.prog[0]/b.prog[1]*100}%"></i></span><small>${b.prog[0]}/${b.prog[1]}</small></div>`:""}</div></div>`).join("")+`</div>`}
function pagePlayer(){const i=view.pl,name=PLAYERS[i],r=board("").find(x=>x.i===i);
  const seen=MATCHES.filter(m=>locked(m)&&OTHERS[m.id][i]).slice().reverse(),hidden=MATCHES.filter(m=>!locked(m)&&OTHERS[m.id][i]).length;
  const st=[["Rang","#"+r.rank],["Points",r.pts],["Bons vainqueurs",`${r.ok}/${r.pl}`],["Scores exacts",r.ex],["Outsiders",r.ud||0],["Pronos à venir",hidden]];
  return shell(`<button class="back" onclick="go('classement')">← Classement</button>`+ptitle("Joueur",esc(name))+`<div class="stats">${st.map(([l,v])=>`<div class="card stat"><small>${l}</small><div class="d">${v}</div></div>`).join("")}</div>`+
  badgeGrid(badgesOf(i))+`<h2 class="d" style="font-size:26px">Historique</h2><p class="muted" style="font-size:12px;margin:4px 0 12px">Les pronos apparaissent au coup d'envoi de chaque match.</p><div class="card">`+
  seen.slice(0,60).map(m=>{const p=OTHERS[m.id][i],x=m.st==="FINISHED"?scoreFull(m,p):null;
    return`<div class="h"><span class="a"><span class="tag" style="background:${m.color}">${LG[m.league].name}</span></span><span class="b muted">${dayL(m.start)} · ${timeL(m.start)}</span><span class="c">${esc(dname(m.t1))} <span class="muted">vs</span> ${esc(dname(m.t2))}${x?` <span class="muted" style="font-weight:400">(${m.res[0]}-${m.res[1]})</span>`:""}</span><span class="e muted">Prono : <b style="color:#fff">${esc(dname(p[0]>p[1]?m.t1:m.t2))}</b>${m.bo>1?` (${p[0]}-${p[1]})`:""}</span><span class="f">${x?`<b class="d" style="font-size:20px;color:${x.pts?(x.ex?"var(--gold)":"var(--green)"):"var(--muted)"}">+${x.pts}${x.pts&&x.mult>1?`<span style="font-size:12px;color:var(--gold);margin-left:4px">×${fmtM(x.mult)}</span>`:""}</b>`:`<span class="muted">en cours</span>`}</span></div>`}).join("")+`</div>`)}
function pageProfil(){
  const r=board("").find(x=>x.me),mine=MATCHES.filter(m=>picks[m.id]).slice().reverse(),pend=mine.filter(m=>m.st!=="FINISHED").length;
  const st=[["Rang","#"+r.rank],["Points",r.pts],["Bons vainqueurs",`${r.ok}/${r.pl}`],["Scores exacts",r.ex],["Outsiders",r.ud||0],["En attente",pend]];
  return shell(ptitle("Mon profil",esc(me))+`<div class="stats">${st.map(([l,v])=>`<div class="card stat"><small>${l}</small><div class="d">${v}</div></div>`).join("")}</div>`+
  badgeGrid(badgesOf(-1))+slackBox()+
  (()=>{const mineB=BRACKETS.filter(b=>bpicks[b.slug]&&Object.keys(bpicks[b.slug]).length);if(!mineB.length)return"";
    return`<h2 class="d" style="font-size:26px;margin-bottom:12px">Tableaux</h2><div class="card" style="margin-bottom:32px">`+mineB.map(b=>{const x=scoreB(b,bpicks[b.slug]),fin=Object.keys(b.results).length;
      return`<button class="h" style="width:100%;grid-template-columns:auto 1fr auto;grid-template-areas:'tag teams pts'" onclick="openB('${b.slug}')"><span class="a"><span class="tag" style="background:${LG[b.event].color}">${LG[b.event].name}</span></span><span class="c">${b.name}</span><span class="f">${fin?`<b class="d" style="font-size:20px">+${x.pts}</b> <span class="muted">/ ${maxB(b.format)}</span>`:`<span class="muted">en attente</span>`}</span></button>`}).join("")+`</div>`})()+
  `<h2 class="d" style="font-size:26px;margin-bottom:12px">Historique</h2><div class="card">`+
  (mine.length?mine.map(m=>{const p=picks[m.id],x=m.st==="FINISHED"?scoreFull(m,p):null;
    return`<div class="h"><span class="a"><span class="tag" style="background:${m.color}">${LG[m.league].name}</span></span><span class="b muted">${dayL(m.start)} · ${timeL(m.start)}</span><span class="c">${esc(dname(m.t1))} <span class="muted">vs</span> ${esc(dname(m.t2))}${x?` <span class="muted" style="font-weight:400">(${m.res[0]}-${m.res[1]})</span>`:""}</span><span class="e muted">Prono : <b style="color:#fff">${esc(dname(p[0]>p[1]?m.t1:m.t2))}</b>${m.bo>1?` (${p[0]}-${p[1]})`:""}</span><span class="f">${x?`<b class="d" style="font-size:20px;color:${x.pts?(x.ex?"var(--gold)":"var(--green)"):"var(--muted)"}">+${x.pts}${x.pts&&x.mult>1?`<span style="font-size:12px;color:var(--gold);margin-left:4px">×${fmtM(x.mult)}</span>`:""}</b>`:`<span class="muted">en attente</span>`}</span></div>`}).join(""):`<div class="muted" style="text-align:center;padding:40px">Aucun prono pour l'instant.</div>`)+`</div>`)}
function slackBox(){const on=store.get("slack",true);
  const next=MATCHES.find(m=>m.st==="UPCOMING"&&!picks[m.id]);
  const ex=next?`<b>⏰ ${esc(dname(next.t1))} vs ${esc(dname(next.t2))} commence à ${timeL(next.start)} et tu n'as pas pronostiqué.</b><div class="lines">• <b>${esc(dname(next.t1))}</b> vs <b>${esc(dname(next.t2))}</b> · ${LG[next.league].name} · ${timeL(next.start)}</div>`
    :`<b>🏆 Le tableau MSI Démo ferme à ${timeL(demoLock)} et tu ne l'as pas rempli.</b><div class="lines">Jusqu'à 40 pts pour le bon champion.</div>`;
  return`<div class="card slackbox"><div class="top"><div><div class="d" style="font-size:22px">Rappels Slack</div><p>Un message privé environ 1 h avant un match que tu n'as pas pronostiqué, et 3 h avant la fermeture d'un tableau incomplet.</p></div>
    <button class="sw ${on?"on":""}" role="switch" aria-checked="${on}" aria-label="Rappels Slack" onclick="toggleSlack()"><i></i></button></div>
    ${on?`<small>Aperçu du message que tu recevrais :</small><div class="slackmsg"><span class="av">W</span><div><b>LoL Pronos</b><span class="app">APP</span><span class="when">${timeL(new Date(now))}</span><div>${ex}</div><span class="sbtn">Pronostiquer</span></div></div>
    <small>Sur la chaîne de la communauté : le programme du jour à 9 h, le classement chaque lundi avec le coup d'outsider de la semaine, et l'ouverture des tableaux MSI / Worlds.</small>`:`<small>Rappels désactivés. Tu continues de voir les annonces sur la chaîne de la communauté.</small>`}</div>`}
function toggleSlack(){store.set("slack",!store.get("slack",true));render();toast(store.get("slack",true)?"Rappels Slack activés":"Rappels Slack désactivés")}
function pageTableaux(){
  return shell(ptitle("MSI · Worlds","Tableaux")+`<p class="bnote">Avant le premier match de la phase finale, remplis tout le tableau : choisis le vainqueur de chaque affiche jusqu'au champion. Chaque bon vainqueur rapporte des points, de 10 au premier tour à 40 pour le champion. Les points s'ajoutent au classement général.</p><div class="tcards">`+
  BRACKETS.map(b=>{const F=FORMATS[b.format],open=!bLocked(b),champ=b.results[F.final],mine=bpicks[b.slug]||{},done=Object.keys(resolveB(b.format,b.seeds,mine).picks).length,tot=F.nodes.length,x=scoreB(b,mine);
    return`<button class="card tcard" onclick="openB('${b.slug}')"><div class="th"><span class="tag" style="background:${LG[b.event].color};color:#fff">${LG[b.event].name}</span><span>${F.name} · 8 équipes</span><span class="tag" style="background:${open?"var(--green)":"var(--line)"};color:#fff">${open?"Ouvert":"Terminé"}</span></div>
    <h2 class="d">${b.name}</h2><p>${open?`Pronos jusqu'au ${dayL(b.lockAt).toLowerCase()} à ${timeL(b.lockAt)}`:`Phase finale lancée le ${dayL(b.lockAt).toLowerCase()}`}${b.demo?" · tableau fictif pour tester":""}</p>
    <div class="tf">${champ?`<span class="champ">${badge(champ,28)}<span>Champion : <b>${esc(dname(champ))}</b></span></span>`:""}<span>${champ?(done?`<b class="d" style="font-size:22px">${x.pts}</b> <span class="muted">/ ${maxB(b.format)} pts</span>`:`<span class="muted">Pas de tableau rempli</span>`):`<b style="color:${done===tot?"#4ade80":"var(--gold)"}">${done===tot?"Tableau complet ✓":`${done}/${tot} choix`}</b>`}</span></div></button>`}).join("")+`</div>`)}
function pageBracket(){
  const b=BRACKETS.find(x=>x.slug===view.br),F=FORMATS[b.format],lk=bLocked(b),mine=resolveB(b.format,b.seeds,bpicks[b.slug]||{}),tot=F.nodes.length,done=Object.keys(mine.picks).length,x=scoreB(b,bpicks[b.slug]);
  let nodes=mine.nodes;
  if(lk){const act=resolveB(b.format,b.seeds,b.results).nodes;nodes=act.map((a,i)=>({...a,A:a.A??mine.nodes[i].A,B:a.B??mine.nodes[i].B,pick:mine.picks[a.id]??null}))}
  // champion le plus choisi, visible une fois le tableau verrouillé
  let cstats="";
  if(lk){const c={};[...BOTHERS[b.slug],mine.picks].forEach(p=>{if(!p)return;const ch=resolveB(b.format,b.seeds,p).picks[F.final];if(ch)c[ch]=(c[ch]||0)+1});
    const t=Object.values(c).reduce((a,n)=>a+n,0);cstats=`<div class="card cstats"><span class="muted" style="font-size:12px;text-transform:uppercase">Champions choisis (${t})</span>${Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,n])=>`<span><b>${esc(dname(k))}</b> <span class="muted">${Math.round(n/t*100)}%</span></span>`).join("")}</div>`}
  const champ=mine.picks[F.final];
  const head=`<button class="back" onclick="go('tableaux')">← Tous les tableaux</button>`+ptitle(F.name,b.name,lk?`<div class="card mypos" style="padding:12px 20px;display:flex;gap:24px;align-items:center"><div class="muted" style="font-size:12px;text-transform:uppercase">Tes points</div><div class="d" style="font-size:30px">${x.pts}<span class="muted" style="font-size:18px"> / ${maxB(b.format)}</span></div></div>`:"")+
    `<p class="bnote">${lk?`Tableau verrouillé depuis le ${dayL(b.lockAt).toLowerCase()} à ${timeL(b.lockAt)}. ${done?`${x.ok} bon${x.ok>1?"s":""} vainqueur${x.ok>1?"s":""} sur ${x.dec} matchs.`:"Tu n'avais pas rempli ce tableau."}`:`Modifiable jusqu'au ${dayL(b.lockAt).toLowerCase()} à ${timeL(b.lockAt)}. Changer un vainqueur efface les choix qui en dépendaient.`}</p>`+
    (lk?cstats:`<div class="bprog"><span class="d" style="font-size:20px">${done}/${tot} <span class="muted">choix</span></span><span class="pb"><i style="width:${done/tot*100}%"></i></span><span class="hint">Clique sur l'équipe qui gagne chaque match</span>${champ?`<span class="tag" style="background:var(--gold);color:#000">Ton champion : ${esc(dname(champ))}</span>`:""}</div>`);
  const nodeHtml=n=>{const res=b.results[n.id];
    const row=(t,sd)=>{if(!t)return`<button disabled><span class="ph"></span><span class="d tn tbd">À déterminer</span></button>`;
      const sel=n.pick===t,won=res===t,wrong=sel&&res&&res!==t,cls=sel&&!res?"sel":sel&&won?"win":wrong?"wrong":"";
      return`<button class="${cls}" ${lk?"disabled":""} aria-pressed="${sel}" onclick="chooseB('${n.id}','${sd}')">${badge(t,28)}<span class="d tn">${esc(dname(t))}</span>${won?`<span class="ok">✓</span>`:""}</button>`};
    const foot=lk?(n.pick&&n.pick!==n.A&&n.pick!==n.B?`<div class="nf">Ton prono : <s>${esc(dname(n.pick))}</s></div>`:!n.pick?`<div class="nf">Pas de prono</div>`:""):"";
    return`<div class="card node ${n.side==="F"?"final":""}"><div class="nh"><span>${n.label}</span><span>${n.pts} pts</span></div>${row(n.A,"A")}${row(n.B,"B")}${foot}</div>`};
  const secs=[["UB","Tableau des gagnants"],["LB","Tableau des perdants"],["F","Finale"]].map(([side,title])=>{const ns=nodes.filter(n=>n.side===side);if(!ns.length)return"";
    const cols=[...new Set(ns.map(n=>n.col))].sort((a,b)=>a-b);
    return`<section class="bsec">${b.format==="DOUBLE"?`<h2 class="d">${title}</h2>`:""}<div class="bcols">${cols.map(c=>{const cn=ns.filter(n=>n.col===c),lab=F.cols?F.cols[c]:(cn[0].label.includes("·")?cn[0].label.split("·")[1].trim():cn[0].label);
      return`<div class="bcol"><small>${lab}</small><div class="bnodes">${cn.map(nodeHtml).join("")}</div></div>`}).join("")}</div></section>`}).join("");
  return shell(head+secs)}
function pageLogin(){
  return`<div class="login"><section class="hero">${logo("big onred")}<div><h1 class="d">Pronostique.<br>Grimpe.<br>Domine.</h1><p>Le concours de pronos League of Legends réservé aux équipes Winamax. Tous les matchs des ligues majeures, un seul classement.</p></div><div style="display:flex;gap:8px">${LEAGUES.map(l=>`<span class="tag" style="background:var(--black);font-size:16px">${l.name}</span>`).join("")}</div></section>
  <section class="side"><div>${view.page==="login"?`<h2 class="d" style="font-size:32px;margin-bottom:8px">Connexion</h2><p class="muted" style="font-size:14px;margin-bottom:24px">Pas de mot de passe : on t'envoie un lien magique sur ton email pro.<br><i>(Preview : aucun email n'est envoyé.)</i></p>
  <form onsubmit="login(event)"><label class="muted" style="font-size:14px;display:block;margin-bottom:8px" for="em">Ton adresse email Winamax</label><input class="input" id="em" type="email" required placeholder="prenom.nom@winamax.fr"><button class="btn btn-red" style="width:100%;margin-top:12px">Recevoir mon lien de connexion</button>${view.err?`<p class="err">${view.err}</p>`:""}</form>`
  :`<h2 class="d" style="font-size:32px;margin-bottom:8px">Choisis ton pseudo</h2><p class="muted" style="font-size:14px;margin-bottom:24px">Il apparaîtra dans le classement visible par tous les collègues.</p>
  <form onsubmit="setName(event)"><input class="input" id="nm" required minlength="3" maxlength="20" placeholder="Ton pseudo" autofocus><button class="btn btn-red" style="width:100%;margin-top:12px">C'est parti</button>${view.err?`<p class="err">${view.err}</p>`:""}</form>`}</div></section></div>`}
function render(){const p=view.page;document.body.classList.toggle("app",p!=="login"&&p!=="pseudo");document.getElementById("app").innerHTML=p==="login"||p==="pseudo"?pageLogin():p==="classement"?pageClassement():p==="joueur"?pagePlayer():p==="tableaux"?pageTableaux():p==="bracket"?pageBracket():p==="profil"?pageProfil():pageMatchs()}
// ---- actions
function go(p){view.page=p;view.lg="";view.more=0;view.open=null;render();scrollTo(0,0)}
function setLg(c){view.lg=c;view.more=0;render()}
function setCv(k){view.cv=k;view.per="";render()}
function setPer(id){view.per=id;render()}
function openPlayer(i){if(i<0){go("profil");return}view.page="joueur";view.pl=i;render();scrollTo(0,0)}
function toggleOthers(id){view.open=view.open===id?null:id;const y=scrollY;render();scrollTo(0,y)}
function openB(slug){view.page="bracket";view.br=slug;render();scrollTo(0,0)}
function chooseB(nodeId,sd){const b=BRACKETS.find(x=>x.slug===view.br);if(bLocked(b))return;
  const r=resolveB(b.format,b.seeds,bpicks[b.slug]||{}),n=r.nodes.find(x=>x.id===nodeId),team=sd==="A"?n.A:n.B,cur=r.picks;if(!team)return;bpicks[b.slug]=resolveB(b.format,b.seeds,{...cur,[nodeId]:team}).picks;
  store.set("bpicks",bpicks);const y=scrollY;render();scrollTo(0,y);toast("Tableau enregistré ✓")}
function setVue(v){view.vue=v;render()}
function choose(id,a,b){const m=MATCHES.find(x=>x.id===id);if(locked(m))return;picks[id]=[a,b];store.set("picks",picks);render();toast("Prono enregistré ✓")}
function login(e){e.preventDefault();const v=document.getElementById("em").value.trim().toLowerCase(),d=v.split("@")[1];
  if(d!=="winamax.fr"&&d!=="winamax.com"){view.err="Accès réservé aux adresses @winamax.fr / @winamax.com.";render();return}
  view.err="";view.page="pseudo";render()}
function setName(e){e.preventDefault();const v=document.getElementById("nm").value.trim();
  if(!/^[\p{L}\p{N} _.\-]{3,20}$/u.test(v)){view.err="3 à 20 caractères : lettres, chiffres, espaces, _ . -";render();return}
  if(PLAYERS.some(p=>p.toLowerCase()===v.toLowerCase())){view.err="Ce pseudo est déjà pris.";render();return}
  me=v;store.set("me",me);
  seedMe();
  view={page:"matchs",vue:"avenir",lg:"",err:""};render()}
function logout(){me=null;store.set("me",null);view.page="login";render()}
render();
</script>
