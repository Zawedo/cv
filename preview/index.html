<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<meta name="robots" content="noindex">
<title>LoL Pronos – Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800;1,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23E30613'/%3E%3Ctext x='16' y='23' font-family='Arial Black' font-weight='900' font-style='italic' font-size='18' fill='%23fff' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<style>
:root{--red:#E30613;--red-d:#B0040E;--black:#0B0B0B;--ink:#141414;--card:#1C1C1C;--line:#2C2C2C;--muted:#9A9A9A;--gold:#F5C400;--green:#22a559}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:#fff;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}
.d{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:-.01em}
.muted{color:var(--muted)}
.tag{display:inline-block;transform:skewX(-12deg);padding:2px 8px;font-family:"Barlow Condensed";font-weight:800;font-style:italic;text-transform:uppercase;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;font-family:"Barlow Condensed";font-weight:800;font-style:italic;text-transform:uppercase;font-size:17px;transition:.15s}
.btn-red{background:var(--red)}.btn-red:hover{background:var(--red-d)}
.btn-ghost{border:1px solid var(--line)}.btn-ghost:hover{border-color:#fff}
.input{width:100%;background:var(--ink);border:1px solid var(--line);padding:12px 16px;color:#fff;font:inherit}
.input:focus{outline:none;border-color:var(--red)}
.card{background:var(--card);border:1px solid var(--line)}
.wrap{max-width:1152px;margin:0 auto;padding:0 16px}
.preview-bar{background:var(--gold);color:#000;font-size:13px;font-weight:600;text-align:center;padding:6px 16px}
.preview-bar button{text-decoration:underline;font-weight:700}
/* logo */
.logo{display:inline-flex;align-items:center;gap:8px;font-size:22px;white-space:nowrap;flex-shrink:0}
.logo .w{background:var(--red);transform:skewX(-12deg);padding:1px 8px}.logo .w span{display:inline-block;transform:skewX(12deg)}
.logo.big{font-size:40px}.logo.onred .w{background:var(--black)}
/* header */
header{position:sticky;top:0;z-index:10;background:rgba(11,11,11,.95);backdrop-filter:blur(6px);border-bottom:2px solid var(--red)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding-top:12px;padding-bottom:12px}
header nav{display:flex;gap:4px;overflow-x:auto}
header nav button{padding:6px 12px;font-size:19px;color:var(--muted)}header nav button:hover{color:#fff}header nav button.on{background:var(--red);color:#fff}
.who{margin-left:auto;display:flex;gap:12px;font-size:14px;align-items:center}

main.wrap{padding-top:32px;padding-bottom:48px}
.ptitle{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}
.ptitle h1{font-size:clamp(36px,6vw,52px);line-height:1;margin-top:8px}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{padding:6px 16px;font-size:19px;background:var(--card);color:var(--muted)}.tabs button:hover{color:#fff}.tabs button.on{background:#fff;color:#000}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
.rules{font-size:14px;margin-bottom:24px}.rules b{color:#fff}
.day{margin-bottom:32px}.day h2{font-size:26px;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:12px}
.grid{display:grid;gap:12px}@media(min-width:768px){.grid{grid-template-columns:1fr 1fr}}
/* match card */
.m{position:relative}.m.picked{border-left:4px solid var(--red)}
.m-head{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.m-head .t{font-weight:700;color:#fff;margin-left:auto}
.m-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:16px}
.team{display:flex;align-items:center;gap:12px;min-width:0}.team.r{flex-direction:row-reverse;text-align:right}.team.lost{opacity:.45}
.badge{width:44px;height:44px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-family:"Barlow Condensed";font-weight:800;font-style:italic;font-size:14px}
.tname{font-size:clamp(18px,2.4vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub{font-size:12px;font-weight:600}
.score{font-size:30px;text-align:center}
.opts{display:grid;gap:6px;padding:0 16px}
.opts button{background:var(--ink);color:var(--muted);padding:8px 0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opts button:not(:disabled):hover{background:var(--line);color:#fff}
.opts button.sel{background:var(--red);color:#fff}
.opts button:disabled{cursor:default}.opts button:disabled:not(.sel){opacity:.4}
.m-foot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding:12px 16px 16px;font-size:12px;color:var(--muted)}
.comm{margin-left:auto;display:flex;align-items:center;gap:8px}
.bar{display:flex;width:96px;height:6px;background:var(--line)}.bar i{background:var(--red)}
.live{animation:p 1.4s infinite}@keyframes p{50%{opacity:.4}}
/* leaderboard */
.podium{display:grid;gap:12px;margin-bottom:32px}@media(min-width:640px){.podium{grid-template-columns:repeat(3,1fr)}}
.pod{position:relative;overflow:hidden;padding:20px}.pod.first{border-color:var(--gold)}
.pod .n{position:absolute;right:8px;top:-20px;font-size:110px;color:rgba(255,255,255,.05)}
.pod .nm{font-size:30px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--ink);color:var(--muted);text-align:left;padding:12px 16px;font-size:16px}
td{border-top:1px solid var(--line);padding:12px 16px}.num{text-align:right}tr.me{background:rgba(227,6,19,.15)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:32px}@media(min-width:640px){.stats{grid-template-columns:repeat(5,1fr)}}
.stat{padding:16px;min-width:0}.stat small{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat div{font-size:30px}
.hist>div{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;font-size:14px;border-top:1px solid var(--line)}.hist>div:first-child{border-top:0}
/* login */
.login{display:grid;min-height:calc(100vh - 31px)}@media(min-width:1024px){.login{grid-template-columns:1fr 1fr}}
.hero{position:relative;overflow:hidden;background:var(--red);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:48px}
.hero:after{content:"";position:absolute;right:-96px;top:0;height:100%;width:288px;transform:skewX(-12deg);background:rgba(176,4,14,.6)}
.hero>*{position:relative;z-index:1}.hero h1{font-size:clamp(48px,7vw,80px);line-height:.95}
.hero p{margin-top:24px;max-width:440px;font-size:18px;color:rgba(255,255,255,.9)}
.side{display:flex;align-items:center;justify-content:center;padding:32px}.side>div{width:100%;max-width:380px}
.err{color:var(--red);font-size:14px;margin-top:8px}
footer{border-top:1px solid var(--line);padding:24px 16px;text-align:center;font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;font-weight:600;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30;white-space:nowrap}.toast.on{opacity:1}
.short{display:none}
.who b{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout svg{display:none}
.bnav{display:none}
.seg{display:flex;gap:4px}
/* historique : une ligne sur ordinateur */
.h{display:grid;grid-template-columns:52px 210px 1fr auto 120px;grid-template-areas:"tag date teams prono pts";align-items:center;gap:6px 12px;padding:12px 16px;font-size:14px;border-top:1px solid var(--line)}
.h:first-child{border-top:0}.h .a{grid-area:tag}.h .b{grid-area:date}.h .c{grid-area:teams;font-weight:600}.h .e{grid-area:prono}.h .f{grid-area:pts;text-align:right}
/* tablette */
@media(max-width:1100px){.m-body{align-items:start}.team,.team.r{flex-direction:column;text-align:center;gap:6px}.tname{white-space:normal;line-height:1.05;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.score{padding-top:6px}}
@media(max-width:900px){.h{grid-template-columns:auto 1fr auto;grid-template-areas:"tag date pts" "teams teams teams" "prono prono prono"}}
/* ================= TÉLÉPHONE ================= */
@media(max-width:640px){
  .long{display:none}.short{display:inline}
  header .wrap{flex-wrap:nowrap;padding-top:10px;padding-bottom:10px}
  header nav{display:none}
  .logo{font-size:19px}.logo.big{font-size:30px}
  .who{gap:8px;min-width:0}.who b{max-width:110px;font-size:13px}
  .logout span{display:none}.logout svg{display:block}.logout{padding:6px;margin-right:-6px}
  .bnav{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(11,11,11,.97);backdrop-filter:blur(8px);border-top:2px solid var(--red);padding-bottom:env(safe-area-inset-bottom)}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:15px;color:var(--muted);position:relative}
  .bnav button.on{color:#fff}.bnav button.on:before{content:"";position:absolute;top:-2px;left:25%;right:25%;height:3px;background:#fff}
  .bnav svg{width:22px;height:22px}
  body.app{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  body.app .toast{bottom:calc(78px + env(safe-area-inset-bottom))}
  main.wrap{padding-top:20px}
  .ptitle{margin-bottom:16px}.ptitle>*{width:100%}
  .seg button{flex:1}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:1 0 auto;padding:6px 14px;font-size:17px}
  .row{gap:10px;margin-bottom:16px}.row .tabs{width:calc(100% + 32px)}
  .rules{font-size:13px;margin-bottom:16px}
  .day{margin-bottom:24px}.day h2{font-size:22px;position:sticky;top:57px;z-index:5;background:var(--black);padding-top:6px}
  .m-head{padding:8px 12px}
  .m-body{padding:14px 12px;gap:8px;align-items:start}
  .badge{width:40px;height:40px}
  .score{font-size:26px;padding-top:6px}
  .opts{padding:0 12px}.opts button{padding:11px 0;font-size:17px}
  .m-foot{padding:10px 12px 14px}
  .comm{margin-left:0;width:100%;justify-content:space-between}.bar{flex:1}
  .podium{grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
  .pod{padding:12px 10px}.pod .n{font-size:64px;top:-8px;right:4px}.pod .nm{font-size:17px;margin-top:6px}.pod .muted{font-size:12px}.pod .muted span{display:none}
  th,td{padding:10px 8px}th{font-size:14px}.hide-sm{display:none}
  .stats{grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:24px}.stat{grid-column:span 2;padding:12px}.stat:nth-child(-n+2){grid-column:span 3}.stat div{font-size:24px}.stat small{font-size:10px}
  .hero{padding:28px 20px;gap:28px}.side{padding:28px 20px}
  .mypos{display:flex!important;justify-content:space-between;align-items:center;text-align:left!important;padding:10px 14px!important}.mypos .d{font-size:24px!important}
  footer{display:none}
}
@media(max-width:360px){.logo{font-size:17px}.who b{max-width:90px}.hide-xs{display:none}th,td{padding:10px 6px}.pn{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tname{font-size:16px}}
</style>
</head>
<body>
<div class="preview-bar"><span class="long">Version preview · données fictives · tes pronos sont enregistrés uniquement dans ce navigateur</span><span class="short">Preview · données fictives</span> · <button onclick="resetDemo()">réinitialiser</button></div>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const LEAGUES=[{code:"LCK",color:"#C8102E"},{code:"LPL",color:"#E8B100"},{code:"LEC",color:"#00C2C7"},{code:"LCS",color:"#0A96FF"}];
const TEAMS={LCK:["T1","Gen.G","Hanwha Life Esports","KT Rolster","Dplus KIA","BNK FEARX"],LPL:["Bilibili Gaming","Top Esports","JD Gaming","Anyone's Legend","Weibo Gaming","Invictus Gaming"],LEC:["G2 Esports","Fnatic","Karmine Corp","Movistar KOI","Team Vitality","Team Heretics"],LCS:["Cloud9","FlyQuest","Team Liquid","100 Thieves","Dignitas","Shopify Rebellion"]};
const PLAYERS=["Faker2Poker","Gank&Bluff","AllInBaron","NashorNuts","TiltProof","RiverKing","SmiteOrFold","ZedPokerFace","FlashOnD","BaronCall","CheckRaiseKC","DragonSoul"];
const HOURS={LCK:9,LPL:11,LEC:18,LCS:23};
// ---- barème (identique à src/lib/scoring.ts)
const opts=bo=>{const w=Math.ceil(bo/2),a=[],b=[];for(let l=0;l<w;l++){a.push([w,l]);b.push([l,w])}return a.concat(b.reverse())};
const bonus=bo=>bo>=5?10:bo>=3?5:0;
const scoreP=(bo,p,r)=>{const gw=(p[0]>p[1])===(r[0]>r[1]),ex=p[0]===r[0]&&p[1]===r[1];return gw?{pts:10+(ex?bonus(bo):0),ex}:{pts:0,ex:false}};
// ---- données de démo déterministes, calées sur la date du jour
let s=7;const rnd=()=>(s=s*16807%2147483647)/2147483647,pick=a=>a[Math.floor(rnd()*a.length)];
const now=Date.now(),today=new Date();today.setHours(0,0,0,0);
const MATCHES=[],OTHERS={};
let id=0;
for(const L of LEAGUES){const T=TEAMS[L.code];for(let d=-7;d<=7;d++){if((d+L.code.charCodeAt(1))%2)continue;for(let k=0;k<2;k++){
  const sh=[...T].sort(()=>rnd()-.5),bo=d===7||d===6?5:L.code==="LEC"&&d<0?1:3;
  const start=new Date(today.getTime()+d*864e5+(HOURS[L.code]+k*3)*36e5);
  const st=start.getTime()+3*36e5<now?"FINISHED":start.getTime()<now?"LIVE":"UPCOMING";
  const res=st==="FINISHED"?pick(opts(bo)):null;
  const m={id:"m"+id++,league:L.code,color:L.color,stage:"Split 1 · Semaine "+(5+Math.floor((d+7)/7)),t1:sh[0],t2:sh[1],bo,start,st,res};
  OTHERS[m.id]=PLAYERS.map(()=>rnd()<(st==="UPCOMING"?.45:.8)?pick(opts(bo)):null);
  MATCHES.push(m)}}}
MATCHES.sort((a,b)=>a.start-b.start);
// ---- état local
const store={get(k,d){try{const v=localStorage.getItem("wlp_"+k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem("wlp_"+k,JSON.stringify(v))}catch{}}};
let me=store.get("me",null),picks=store.get("picks",{});
// on pré-remplit quelques pronos passés pour que le profil ne soit pas vide
if(me&&!store.get("seeded",false)){MATCHES.filter(m=>m.st==="FINISHED").forEach(m=>{if(rnd()<.6)picks[m.id]=pick(opts(m.bo))});store.set("picks",picks);store.set("seeded",true)}
let view={page:me?"matchs":"login",vue:"avenir",lg:"",err:""};
function resetDemo(){try{Object.keys(localStorage).filter(k=>k.startsWith("wlp_")).forEach(k=>localStorage.removeItem(k))}catch{}me=null;picks={};view={page:"login",vue:"avenir",lg:"",err:""};render()}
// ---- helpers
const TZ={timeZone:"Europe/Paris"};
const dayL=d=>{const x=d.toLocaleDateString("fr-FR",{...TZ,weekday:"long",day:"numeric",month:"long"});return x[0].toUpperCase()+x.slice(1)};
const timeL=d=>d.toLocaleTimeString("fr-FR",{...TZ,hour:"2-digit",minute:"2-digit"});
const tag=n=>{const c=n.replace(/[^\p{L}\p{N} ]/gu,"").trim(),w=c.split(/\s+/);return c.length<=4?c.toUpperCase():(w.length>1?w.map(x=>x[0]).join(""):c.slice(0,3)).toUpperCase().slice(0,4)};
const col=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return`hsl(${h} 45% 32%)`};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const locked=m=>m.st!=="UPCOMING";
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1600)}
const logo=(c="")=>`<span class="logo d ${c}"><span class="w"><span>Wina</span></span><span>LoL Pronos</span></span>`;
// ---- classement
function board(lg){
  const rows=PLAYERS.map((n,i)=>({name:n,i,pts:0,ok:0,ex:0,pl:0}));
  if(me)rows.push({name:me,i:-1,pts:0,ok:0,ex:0,pl:0,me:true});
  for(const m of MATCHES){if(m.st!=="FINISHED"||(lg&&m.league!==lg))continue;
    rows.forEach(r=>{const p=r.me?picks[m.id]:OTHERS[m.id][r.i];if(!p)return;const x=scoreP(m.bo,p,m.res);r.pl++;r.pts+=x.pts;if(x.pts)r.ok++;if(x.ex)r.ex++})}
  rows.sort((a,b)=>b.pts-a.pts||b.ex-a.ex||b.ok-a.ok||a.name.localeCompare(b.name));
  let rk=0;rows.forEach((r,i)=>{const p=rows[i-1];if(!p||p.pts!==r.pts||p.ex!==r.ex||p.ok!==r.ok)rk=i+1;r.rank=rk});return rows}
// ---- rendu
function shell(inner){
  const nav=[["matchs","Matchs"],["classement","Classement"],["profil","Mes pronos"]].map(([k,l])=>`<button class="d ${view.page===k?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
  const bnav=[["matchs","Matchs",ICON.matchs],["classement","Classement",ICON.classement],["profil","Mes pronos",ICON.profil]].map(([k,l,i])=>`<button class="d ${view.page===k?"on":""}" onclick="go('${k}')" aria-current="${view.page===k?"page":"false"}">${i}<span>${l}</span></button>`).join("");
  return`<header><div class="wrap"><button onclick="go('matchs')" aria-label="Accueil">${logo()}</button><nav>${nav}</nav><div class="who"><b>${esc(me)}</b><button class="muted logout" onclick="logout()" aria-label="Déconnexion"><span>Déconnexion</span>${ICON.logout}</button></div></div></header>
  <main class="wrap">${inner}</main><footer>Concours interne réservé aux collaborateurs Winamax · Jeu gratuit, sans mise · Preview avec données fictives</footer><nav class="bnav" aria-label="Navigation">${bnav}</nav>`}
const ICON={
  matchs:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/><path d="M9.5 6.5 21 18v3h-3l-1.5-1.5"/></svg>`,
  classement:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/></svg>`,
  profil:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>`,
  logout:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>`};
const ptitle=(k,t,right="")=>`<div class="ptitle"><div><span class="tag" style="background:var(--red)">${k}</span><h1 class="d">${t}</h1></div>${right}</div>`;
const tabs=(cur)=>`<div class="tabs">${[["","Toutes"],...LEAGUES.map(l=>[l.code,l.code])].map(([c,l])=>`<button class="d ${cur===c?"on":""}" onclick="setLg('${c}')">${l}</button>`).join("")}</div>`;
function card(m){
  const p=picks[m.id],fin=m.st==="FINISHED",lk=locked(m);
  const pw=p?(p[0]>p[1]?1:2):0,rw=fin?(m.res[0]>m.res[1]?1:2):0;
  const team=(n,side,r)=>`<div class="team ${r?"r":""} ${rw&&rw!==side?"lost":""}"><span class="badge" style="background:${col(n)}">${tag(n)}</span><div style="min-width:0"><div class="d tname">${esc(n)}</div>${pw===side?`<div class="tsub" style="color:var(--red)">Ton choix</div>`:rw===side?`<div class="tsub" style="color:var(--green)">Vainqueur</div>`:""}</div></div>`;
  const o=opts(m.bo).map(([a,b])=>{const sel=p&&p[0]===a&&p[1]===b,lab=m.bo===1?(a?m.t1:m.t2):a+"-"+b;
    return`<button class="d ${sel?"sel":""}" ${lk?"disabled":""} onclick="choose('${m.id}',${a},${b})" aria-pressed="${!!sel}">${esc(lab)}</button>`}).join("");
  const oth=OTHERS[m.id].filter(Boolean),all=p?[...oth,p]:oth,tot=all.length,t1=all.filter(x=>x[0]>x[1]).length,pct=tot?Math.round(t1/tot*100):50;
  let status;
  if(fin&&p){const x=scoreP(m.bo,p,m.res);status=`<span class="tag" style="background:${x.pts?(x.ex?"var(--gold);color:#000":"var(--green)"):"var(--line)"}">${x.pts?`+${x.pts} pts${x.ex?" · score exact":""}`:"0 pt"}</span>`}
  else if(!lk)status=p?"Prono enregistré ✓ – modifiable jusqu'au début":`Jusqu'à ${10+bonus(m.bo)} pts en jeu`;
  else status=p?"Pronos fermés":"Pas de prono";
  const comm=(p||lk)&&tot?`<span class="comm"><span>${tot} pronos</span><span class="bar"><i style="width:${pct}%"></i></span><span>${pct}% / ${100-pct}%</span></span>`:"";
  return`<article class="card m ${p&&!fin?"picked":""}"><div class="m-head"><span class="tag" style="background:${m.color};color:#fff">${m.league}</span><span>${m.stage}</span><span class="t">${timeL(m.start)}</span><span>BO${m.bo}</span>${m.st==="LIVE"?`<span class="tag live" style="background:var(--red);color:#fff">Live</span>`:""}</div>
  <div class="m-body">${team(m.t1,1)}<div class="d score">${fin?`${m.res[0]}<span class="muted"> - </span>${m.res[1]}`:`<span class="muted" style="font-size:20px">VS</span>`}</div>${team(m.t2,2,1)}</div>
  <div class="opts" style="grid-template-columns:repeat(${opts(m.bo).length},1fr)">${o}</div><div class="m-foot"><span>${status}</span>${comm}</div></article>`}
function pageMatchs(){
  const res=view.vue==="res";
  let list=MATCHES.filter(m=>(!view.lg||m.league===view.lg)&&(res?m.st==="FINISHED":m.st!=="FINISHED"));
  if(res)list=list.slice().reverse();
  const todo=list.filter(m=>!locked(m)&&!picks[m.id]).length,days=[];
  list.forEach(m=>{const k=m.start.toLocaleDateString("fr-CA",TZ);let d=days.find(x=>x.k===k);if(!d)days.push(d={k,l:dayL(m.start),it:[]});d.it.push(m)});
  return shell(ptitle(res?"Résultats":"À pronostiquer",res?"Matchs terminés":"Prochains matchs",`<div class="seg"><button class="btn ${!res?"btn-red":"btn-ghost"}" onclick="setVue('avenir')">À venir</button><button class="btn ${res?"btn-red":"btn-ghost"}" onclick="setVue('res')">Résultats</button></div>`)+
  `<div class="row">${tabs(view.lg)}${!res&&todo?`<span class="tag" style="background:var(--gold);color:#000">${todo} match${todo>1?"s":""} sans prono</span>`:""}</div>`+
  (res?"":`<p class="rules muted">Bon vainqueur : <b>10 pts</b> · Score exact en BO3 : <b>+5</b> · en BO5 : <b>+10</b> · Les pronos ferment au coup d'envoi.</p>`)+
  days.map(d=>`<section class="day"><h2 class="d">${d.l}</h2><div class="grid">${d.it.map(card).join("")}</div></section>`).join(""))}
function pageClassement(){
  const rows=board(view.lg),mine=rows.find(r=>r.me),pod=rows.slice(0,3).filter(r=>r.pts>0);
  return shell(ptitle(view.lg||"Général","Classement",mine?`<div class="card mypos" style="padding:12px 20px;text-align:right"><div class="muted" style="font-size:12px;text-transform:uppercase">Ta position</div><div class="d" style="font-size:30px"><span style="color:var(--red)">#${mine.rank}</span> · ${mine.pts} pts</div></div>`:"")+
  `<div style="margin-bottom:24px">${tabs(view.lg)}</div>`+
  `<div class="podium">${pod.map((r,i)=>`<div class="card pod ${i?"":"first"}"><div class="d n">${r.rank}</div><span class="tag" style="background:${i?"var(--red)":"var(--gold);color:#000"}">#${r.rank}</span><div class="d nm">${esc(r.name)}</div><div class="muted"><b style="color:#fff">${r.pts} pts</b><span> · ${r.ex} scores exacts</span></div></div>`).join("")}</div>`+
  `<div class="card tbl"><table><thead><tr class="d"><th>#</th><th>Joueur</th><th class="num">Points</th><th class="num hide-sm">Bons vainqueurs</th><th class="num">Exacts</th><th class="num hide-xs">Réussite</th></tr></thead><tbody>`+
  rows.map(r=>`<tr class="${r.me?"me":""}"><td class="d" style="font-size:18px">${r.rank}</td><td class="pn"><b>${esc(r.name)}</b>${r.me?` <span style="color:var(--red);font-size:12px">toi</span>`:""}</td><td class="num d" style="font-size:20px">${r.pts}</td><td class="num hide-sm">${r.ok}/${r.pl}</td><td class="num">${r.ex}</td><td class="num muted hide-xs">${r.pl?Math.round(r.ok/r.pl*100):0}%</td></tr>`).join("")+`</tbody></table></div>`)}
function pageProfil(){
  const r=board("").find(x=>x.me),mine=MATCHES.filter(m=>picks[m.id]).slice().reverse(),pend=mine.filter(m=>m.st!=="FINISHED").length;
  const st=[["Rang","#"+r.rank],["Points",r.pts],["Bons vainqueurs",`${r.ok}/${r.pl}`],["Scores exacts",r.ex],["En attente",pend]];
  return shell(ptitle("Mon profil",esc(me))+`<div class="stats">${st.map(([l,v])=>`<div class="card stat"><small>${l}</small><div class="d">${v}</div></div>`).join("")}</div>`+
  `<h2 class="d" style="font-size:26px;margin-bottom:12px">Historique</h2><div class="card">`+
  (mine.length?mine.map(m=>{const p=picks[m.id],x=m.st==="FINISHED"?scoreP(m.bo,p,m.res):null;
    return`<div class="h"><span class="a"><span class="tag" style="background:${m.color}">${m.league}</span></span><span class="b muted">${dayL(m.start)} · ${timeL(m.start)}</span><span class="c">${esc(m.t1)} <span class="muted">vs</span> ${esc(m.t2)}${x?` <span class="muted" style="font-weight:400">(${m.res[0]}-${m.res[1]})</span>`:""}</span><span class="e muted">Prono : <b style="color:#fff">${esc(p[0]>p[1]?m.t1:m.t2)}</b>${m.bo>1?` (${p[0]}-${p[1]})`:""}</span><span class="f">${x?`<b class="d" style="font-size:20px;color:${x.pts?(x.ex?"var(--gold)":"var(--green)"):"var(--muted)"}">+${x.pts}</b>`:`<span class="muted">en attente</span>`}</span></div>`}).join(""):`<div class="muted" style="text-align:center;padding:40px">Aucun prono pour l'instant.</div>`)+`</div>`)}
function pageLogin(){
  return`<div class="login"><section class="hero">${logo("big onred")}<div><h1 class="d">Pronostique.<br>Grimpe.<br>Domine.</h1><p>Le concours de pronos League of Legends réservé aux équipes Winamax. Tous les matchs des ligues majeures, un seul classement.</p></div><div style="display:flex;gap:8px">${LEAGUES.map(l=>`<span class="tag" style="background:var(--black);font-size:16px">${l.code}</span>`).join("")}</div></section>
  <section class="side"><div>${view.page==="login"?`<h2 class="d" style="font-size:32px;margin-bottom:8px">Connexion</h2><p class="muted" style="font-size:14px;margin-bottom:24px">Pas de mot de passe : on t'envoie un lien magique sur ton email pro.<br><i>(Preview : aucun email n'est envoyé.)</i></p>
  <form onsubmit="login(event)"><label class="muted" style="font-size:14px;display:block;margin-bottom:8px" for="em">Ton adresse email Winamax</label><input class="input" id="em" type="email" required placeholder="prenom.nom@winamax.fr"><button class="btn btn-red" style="width:100%;margin-top:12px">Recevoir mon lien de connexion</button>${view.err?`<p class="err">${view.err}</p>`:""}</form>`
  :`<h2 class="d" style="font-size:32px;margin-bottom:8px">Choisis ton pseudo</h2><p class="muted" style="font-size:14px;margin-bottom:24px">Il apparaîtra dans le classement visible par tous les collègues.</p>
  <form onsubmit="setName(event)"><input class="input" id="nm" required minlength="3" maxlength="20" placeholder="Ton pseudo" autofocus><button class="btn btn-red" style="width:100%;margin-top:12px">C'est parti</button>${view.err?`<p class="err">${view.err}</p>`:""}</form>`}</div></section></div>`}
function render(){const p=view.page;document.body.classList.toggle("app",p!=="login"&&p!=="pseudo");document.getElementById("app").innerHTML=p==="login"||p==="pseudo"?pageLogin():p==="classement"?pageClassement():p==="profil"?pageProfil():pageMatchs()}
// ---- actions
function go(p){view.page=p;view.lg="";render();scrollTo(0,0)}
function setLg(c){view.lg=c;render()}
function setVue(v){view.vue=v;render()}
function choose(id,a,b){const m=MATCHES.find(x=>x.id===id);if(locked(m))return;picks[id]=[a,b];store.set("picks",picks);render();toast("Prono enregistré ✓")}
function login(e){e.preventDefault();const v=document.getElementById("em").value.trim().toLowerCase(),d=v.split("@")[1];
  if(d!=="winamax.fr"&&d!=="winamax.com"){view.err="Accès réservé aux adresses @winamax.fr / @winamax.com.";render();return}
  view.err="";view.page="pseudo";render()}
function setName(e){e.preventDefault();const v=document.getElementById("nm").value.trim();
  if(!/^[\p{L}\p{N} _.\-]{3,20}$/u.test(v)){view.err="3 à 20 caractères : lettres, chiffres, espaces, _ . -";render();return}
  if(PLAYERS.some(p=>p.toLowerCase()===v.toLowerCase())){view.err="Ce pseudo est déjà pris.";render();return}
  me=v;store.set("me",me);
  MATCHES.filter(m=>m.st==="FINISHED").forEach(m=>{if(rnd()<.6)picks[m.id]=pick(opts(m.bo))});store.set("picks",picks);store.set("seeded",true);
  view={page:"matchs",vue:"avenir",lg:"",err:""};render()}
function logout(){me=null;store.set("me",null);view.page="login";render()}
render();
</script>
</body>
</html>
